# Se incluye en cada "location" que sirve la aplicación (no en /api/: el backend pone sus propias cabeceras).
# "add_header" dentro de un location REEMPLAZA a los del nivel superior: por eso va en un archivo aparte.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header X-Frame-Options "DENY" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;

# HSTS: actívalo solo si ESTE nginx termina el HTTPS (o en quien lo termine). Sobre HTTP los navegadores lo ignoran.
# add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
